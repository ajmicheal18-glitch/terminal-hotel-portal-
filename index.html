<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Portal</title>
<style>
  /* ===== Theme (change colours here) ===== */
  :root {
    --primary: #13203d;
    --primary-dark: #0c1528;
    --accent: #4a6fa5;
    --bg: #f2f6fb;
    --card: #ffffff;
    --text: #1f2d45;
    --muted: #5b6b85;
    --danger: #e11d48;
    --success: #059669;
    --radius: 16px;
    --shadow: 0 10px 25px -8px rgba(19, 32, 61, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; width: 100%; max-width: 1150px; margin: 0 auto; padding: 28px 18px; }
  h1, h2, h3 { line-height: 1.25; font-family: "Noto Serif", Georgia, "Times New Roman", serif; }
  h2 { font-size: 1.6rem; color: var(--primary-dark); margin-bottom: 6px; }
  h3 { font-size: 1.1rem; margin-bottom: 6px; }
  p { margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .section { margin-top: 38px; }

  /* ===== Navigation (Flexbox) ===== */
  .navbar {
    background: var(--primary);
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    box-shadow: 0 4px 14px rgba(19, 32, 61, 0.35);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.3px; }
  .nav-links { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nav-links a, .nav-links button {
    color: #fff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 999px;
    background: transparent;
    border: none;
    font: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  .nav-links a:hover, .nav-links button:hover,
  .nav-links a.active { background: rgba(255, 255, 255, 0.2); }
  .nav-links a.active { font-weight: 600; }

  /* Dropdown menu */
  .dropdown { position: relative; }
  .dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 200px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    list-style: none;
    padding: 6px;
  }
  .dropdown-menu.open { display: block; }
  .dropdown-menu a { display: block; color: var(--text); border-radius: 8px; }
  .dropdown-menu a:hover { background: var(--bg); }

  .logout-btn { background: rgba(255, 255, 255, 0.15) !important; }

  /* ===== Hero (home) ===== */
  .hero {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    border-radius: var(--radius);
    padding: 48px 28px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .hero h1 { font-size: 2.2rem; margin-bottom: 10px; }
  .hero p { font-size: 1.1rem; opacity: 0.95; }

  /* ===== Cards (CSS Grid) ===== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 18px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    border: 1px solid #e2e8f0;
  }
  .card .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0; max-width: 560px; }
  .room-price { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
  .total { font-weight: 700; color: var(--success); }

  /* Status pills */
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    background: #e0e7ff;
    color: var(--primary-dark);
    text-transform: capitalize;
  }
  .pill.green { background: #d1fae5; color: var(--success); }
  .pill.amber { background: #fef3c7; color: #92400e; }
  .pill.red { background: #ffe4e6; color: var(--danger); }

  /* ===== Forms ===== */
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
  .form-row input, .form-row select {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    font: inherit;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-row input:focus, .form-row select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(19, 32, 61, 0.15);
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 11px 20px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 14px -6px rgba(19, 32, 61, 0.6);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.secondary { background: #64748b; box-shadow: none; }
  .btn.danger { background: var(--danger); box-shadow: none; }
  .btn.small { padding: 7px 12px; font-size: 0.9rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .msg { margin-top: 12px; font-weight: 600; min-height: 1.2em; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--success); }

  /* ===== Tables ===== */
  .table-wrap { overflow-x: auto; border-radius: var(--radius); background: var(--card); box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; text-align: left; white-space: nowrap; }
  th { background: #eef2ff; color: var(--primary-dark); font-size: 0.9rem; }
  tr:last-child td { border-bottom: none; }

  .stat { font-size: 1.9rem; font-weight: 800; color: var(--primary); }
  .stat-label { color: var(--muted); font-size: 0.95rem; }

  .bookings-grid .card h3 { font-size: 1.15rem; }
  .hidden-section { display: none; }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 22px;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid #e2e8f0;
    background: #fff;
  }

  /* ===== Phones ===== */
  @media (max-width: 640px) {
    .navbar { flex-direction: column; align-items: stretch; padding: 12px 14px; }
    .nav-links { justify-content: center; }
    .dropdown-menu { position: static; box-shadow: none; margin-top: 6px; }
    .hero { padding: 34px 18px; }
    .hero h1 { font-size: 1.7rem; }
    .row-2 { grid-template-columns: 1fr; }
    .btn { width: 100%; text-align: center; }
    .btn-row .btn { width: auto; }
    main { padding: 20px 14px; }
  }

  /* ===== Visual polish ===== */
  ::selection { background: var(--accent); color: #fff; }
  html { scroll-behavior: smooth; }

  /* Gentle fade-in when a page opens */
  .view:not([hidden]) { animation: fadeUp 0.45s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Hero with soft decorative circles */
  .hero { position: relative; overflow: hidden; isolation: isolate; }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    z-index: -1;
  }
  .hero::before { width: 260px; height: 260px; top: -90px; right: -60px; }
  .hero::after  { width: 180px; height: 180px; bottom: -70px; left: -40px; }

  /* Cards lift on hover and carry a coloured top edge */
  .card {
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 22px; right: 22px; top: 0;
    height: 4px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    opacity: 0.85;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 30px -14px rgba(19, 32, 61, 0.35);
  }

  /* Buttons: clearer hover and press feedback */
  .btn { transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease; }
  .btn:hover { filter: brightness(1.08); box-shadow: 0 10px 20px -8px rgba(19, 32, 61, 0.55); }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn.secondary:hover, .btn.danger:hover { filter: brightness(1.1); }

  /* Menu links */
  .nav-links a, .nav-links button { transition: background 0.2s ease, color 0.2s ease; }
  .nav-links a.active { box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }

  /* Form focus is easy to see */
  .form-row input:focus, .form-row select:focus { outline: none; }

  /* Tables */
  table tr { transition: background 0.15s ease; }
  table tbody tr:hover td, table tr:hover td { background: #f8fafc; }
  .table-wrap table tr:first-child th:first-child { border-top-left-radius: var(--radius); }
  .table-wrap table tr:first-child th:last-child { border-top-right-radius: var(--radius); }

  /* Status pills get a small dot */
  .pill::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0.8;
  }

  /* Messages slide in */
  .msg:not(:empty) { animation: fadeUp 0.3s ease both; }

  /* Footer */
  footer { letter-spacing: 0.2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* ===== Price dropdown on room cards ===== */
  .price-dropdown {
    margin-top: 10px;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
  }
  .price-dropdown summary {
    cursor: pointer;
    padding: 9px 12px;
    font-weight: 600;
    color: var(--primary-dark);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .price-dropdown summary::-webkit-details-marker { display: none; }
  .price-dropdown summary::after { content: "▾"; transition: transform 0.2s ease; }
  .price-dropdown[open] summary::after { transform: rotate(180deg); }
  .price-dropdown[open] summary { border-bottom: 1px solid #e2e8f0; }
  .price-body { padding: 10px 12px; }
  .price-body p { margin-bottom: 4px; }

  /* ===== Printable receipt ===== */
  .receipt { font-family: Roboto, Arial, sans-serif; }
  .receipt-head { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 12px; }
  .receipt-head h2 { font-size: 1.4rem; color: var(--primary); }
  .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .receipt-table td, .receipt-table th { padding: 7px 4px; border-bottom: 1px dashed #cbd5e1; text-align: left; }
  .receipt-table td:last-child, .receipt-table th:last-child { text-align: right; }
  .receipt-table th { background: none; color: var(--muted); font-size: 0.85rem; }
  .receipt-foot { text-align: center; margin-top: 10px; }

  @media print {
    body * { visibility: hidden; }
    #receiptPanel, #receiptPanel * { visibility: visible; }
    #receiptPanel { position: absolute; left: 0; top: 0; width: 100%; max-width: none !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
    .no-print { display: none !important; }
  }
</style>
