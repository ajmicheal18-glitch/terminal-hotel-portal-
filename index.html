<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Hotel Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .report-table { width: 100%; border-collapse: collapse; background: var(--white); }
    .report-table th, .report-table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .report-table th { background: var(--primary); color: var(--white); }
    .big { font-size: 1.6rem; font-weight: bold; color: var(--primary); }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo">Hotel Portal</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="booking.html">Book a Room</a></li>
    <li><a href="reception.html">Reception</a></li>
    <li class="dropdown">
      <button class="dropdown-toggle">Admin ▾</button>
      <ul class="dropdown-menu">
        <li><a href="admin.html#rooms">Manage Rooms</a></li>
        <li><a href="admin.html#sales">Sales</a></li>
        <li><a href="admin.html#reports">Reports</a></li>
      </ul>
    </li>
  </ul>
</nav>

<header class="page-header">
  <h1>Admin Dashboard</h1>
  <p>Rooms, sales and occupancy</p>
</header>

<main>
  <h2 id="rooms">Manage Rooms</h2>

  <div class="card form-card" style="max-width:100%;">
    <h3 id="roomFormTitle">Add a room</h3>
    <form id="roomForm">
      <div class="form-row">
        <label for="roomNumber">Room number</label>
        <input type="text" id="roomNumber" placeholder="e.g. 103" required>
      </div>
      <div class="form-row">
        <label for="roomTypeInput">Room type</label>
        <select id="roomTypeInput">
          <option value="Single">Single</option>
          <option value="Double">Double</option>
          <option value="Suite">Suite</option>
        </select>
      </div>
      <div class="form-row">
        <label for="roomPrice">Price per night (₦)</label>
        <input type="number" id="roomPrice" min="1" step="any" required>
      </div>
      <div class="form-row">
        <label for="roomStatusInput">Status</label>
        <select id="roomStatusInput">
          <option value="free">free</option>
          <option value="cleaning">cleaning</option>
          <option value="occupied">occupied</option>
        </select>
      </div>
      <button type="submit" class="btn">Save Room</button>
      <button type="button" class="btn" id="cancelEdit" hidden style="background:#666; margin-top:8px;">Cancel edit</button>
      <p id="roomMessage" style="margin-top:12px; font-weight:bold;"></p>
    </form>
  </div>

  <div id="adminRoomList" class="card" style="margin-top:20px;"></div>

  <h2 id="sales" style="margin-top:40px;">Sales and Reports</h2>
  <div class="card form-card" style="max-width:100%;">
    <div class="form-row">
      <label for="periodSelect">Report period</label>
      <select id="periodSelect">
        <option value="today">Today</option>
        <option value="month">This month</option>
        <option value="custom">Custom range</option>
      </select>
    </div>
    <div class="form-row">
      <label for="fromDate">From</label>
      <input type="date" id="fromDate">
    </div>
    <div class="form-row">
      <label for="toDate">To</label>
      <input type="date" id="toDate">
    </div>
    <p id="reportRange" style="font-weight:bold;"></p>
  </div>

  <div id="salesSummary" class="card-grid"></div>

  <h3 style="margin-top:30px;">Income by payment method</h3>
  <div id="methodBreakdown" style="margin-top:12px;"></div>
</main>

<footer>
  <p>&copy; 2026 Hotel Portal</p>
</footer>

<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
